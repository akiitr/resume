title: Online Resume
description: A minimalist online resume.
url:
baseurl:

default_language: en
languages:
  en:
    locale: en
    direction: ltr
    font:
      preconnect:
        - https://fonts.googleapis.com
      crossorigin:
        - https://fonts.gstatic.com
      stylesheets:
        - https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600&display=swap
      family: '"Noto Serif", ui-serif, Georgia, serif'
  zh:
    locale: zh
    direction: ltr
    font:
      preconnect:
        - https://fonts.googleapis.com
      crossorigin:
        - https://fonts.gstatic.com
      stylesheets:
        - https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap
      family: '"Noto Serif SC", ui-serif, "Songti SC", STSong, SimSun, serif'

private: false
message: Sorry, my resume has been hidden.
math: true
theme_color: "#1DA1F2"

allow_indexing: true
show_theme_credit: true

analytics:
  umami:
    enable: true
    script: https://u.tarrex.com/u.js
    website_id: af636e2d-31ae-46f1-9071-82b1745143a9
    host_url:
    auto_track:
    domains: tarrex.github.io,tarrex.com
    tag:
    performance:
    exclude_search:
    exclude_hash:
    do_not_track: true
  google:
    enable: false
    id:
    respect_do_not_track: true
  cloudflare:
    enable: false
    token:

features:
  math:
    engine: katex
    version: 0.18.4

markdown: kramdown
kramdown:
  input: GFM
  math_engine: null

liquid:
  error_mode: strict
  strict_filters: true

strict_front_matter: true

exclude:
  - .bundle
  - .git
  - .github
  - .jekyll-cache
  - .jekyll-metadata
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
